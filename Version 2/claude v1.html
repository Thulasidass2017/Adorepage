<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Adore Page</title>
<style>
:root{--bg:#e9e8e4;--panel:#f8f7f4;--ink:#1c2420;--mut:#66706a;--line:#cfd2cb;--acc:#0f766e;--accink:#fff;--mi:#2563eb;--guide:#d6249f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15191a;--panel:#1f2524;--ink:#e8ece9;--mut:#93a09a;--line:#323b39;--acc:#2dd4bf;--accink:#06201c;--mi:#60a5fa;--guide:#f472b6}}
:root[data-theme="dark"]{--bg:#15191a;--panel:#1f2524;--ink:#e8ece9;--mut:#93a09a;--line:#323b39;--acc:#2dd4bf;--accink:#06201c;--mi:#60a5fa;--guide:#f472b6}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.4 "Segoe UI",system-ui,sans-serif}
#app{display:grid;grid-template-columns:210px 1fr;grid-template-rows:auto 1fr;height:100%}
#bar{grid-column:1/3;background:var(--panel);border-bottom:1px solid var(--line);padding:8px 12px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
#bar h1{font:700 17px Georgia,serif;margin:0 10px 0 0}
.sep{width:1px;height:22px;background:var(--line);margin:0 4px}
button,select,input{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:4px 9px}
button{cursor:pointer}button:hover:not(:disabled){border-color:var(--acc)}button:disabled{opacity:.4;cursor:default}
button.pri{background:var(--acc);color:var(--accink);border-color:var(--acc)}
input[type=number]{width:60px}
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
#side{background:var(--panel);border-right:1px solid var(--line);overflow:auto;padding:10px}
#side h2{font:700 12px Georgia,serif;margin:10px 0 6px;color:var(--mut)}
.mrow{display:block;width:100%;text-align:left;margin-bottom:4px}
.mrow.on{border-color:var(--acc);background:var(--acc);color:var(--accink)}
.spread{display:grid;grid-template-columns:1fr 1fr;gap:2px;margin-bottom:6px;border:1px solid var(--line);padding:3px;border-radius:4px}
.chip{height:56px;border:1px solid var(--line);background:#fff;color:#1c2420;font-size:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;border-radius:2px}
.chip.land{height:40px;align-self:center}
.chip.on{border:2px solid var(--acc)}.chip.ps{background:#cfeee9}
.chip.blank{visibility:hidden}.chip small{color:#66706a}
#main{overflow:auto;padding:16px;display:flex;flex-direction:column;align-items:center;gap:8px}
#cap{color:var(--mut);font-size:12px}
#story{width:100%;max-width:560px}#story textarea{width:100%;height:90px;font:12px Georgia,serif}
.pg{position:relative;background:#fff;box-shadow:0 2px 14px rgba(0,0,0,.25);flex:none;overflow:hidden}
.it{position:absolute}
.it.m:hover{outline:1px dashed var(--mi);cursor:pointer}
.it.sel{outline:2px solid var(--acc)}
.tx{width:100%;height:100%;padding:4px;white-space:pre-wrap;font:11px/1.4 Georgia,serif;color:#1c2420;overflow:hidden;outline:none}
.it.story{outline:1px dotted #9aa}.it.story.sel{outline:2px solid var(--acc)}
.tx.st{white-space:normal}.tx p{margin:0 0 6px}.tx h1,.tx h2,.tx h3{margin:0 0 6px;line-height:1.2;font-family:inherit}.tx h1{font-size:1.8em}.tx h2{font-size:1.35em}.tx h3{font-size:1.1em}
.it.over{outline:2px solid #dc2626}
.ov{position:absolute;right:2px;bottom:-16px;font:10px sans-serif;color:#dc2626}
.hm{position:absolute;left:-2px;top:-19px;background:var(--acc);color:var(--accink);font:10px sans-serif;padding:2px 6px;cursor:move;touch-action:none}
.hr{position:absolute;right:-6px;bottom:-6px;width:12px;height:12px;background:var(--acc);cursor:nwse-resize;touch-action:none}
.gm{position:absolute;border:1px dashed var(--guide);pointer-events:none}
.gc{position:absolute;top:0;bottom:0;border-left:1px dashed var(--guide);opacity:.6}
.badge{position:absolute;left:4px;top:4px;font:10px sans-serif;background:var(--mi);color:#fff;padding:1px 6px;border-radius:3px;pointer-events:none}
#print{display:none}
@page{size:420px 594px;margin:0}@page land{size:594px 420px;margin:0}
@media print{
 body{background:#fff}#app{display:none}#print{display:block}
 .sheet{break-after:page;page:auto;overflow:hidden}.sheet.land{page:land}
 .pg{box-shadow:none}}
@media (max-width:700px){#app{grid-template-columns:1fr;grid-template-rows:auto auto 1fr}#bar{grid-column:1}#side{max-height:150px}}
#bar{display:block}.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:3px 0}
button.ib{display:inline-flex;align-items:center;gap:5px;padding:4px 8px}button.ib svg{width:16px;height:16px}
button.on{background:var(--acc);color:var(--accink);border-color:var(--acc)}
.nf{display:inline-flex;align-items:center;gap:3px;font-size:12px;color:var(--mut)}.nf input{width:58px}
input[type=color]{padding:0;width:30px;height:28px}
#main{align-items:flex-start}#main>*{margin-left:auto;margin-right:auto}
.spreadv{display:flex;gap:18px;align-items:flex-start;justify-content:center;width:max-content}
.ph{border:2px dashed var(--line);display:flex;align-items:center;justify-content:center;color:var(--mut);flex:none}
.pg.cur{outline:2px solid var(--acc);outline-offset:3px}
.clip{position:absolute;inset:0;overflow:hidden}.hc{position:absolute;background:var(--acc);border-radius:3px;touch-action:none}
</style></head><body>
<div id="app"><div id="bar"></div><div id="side"></div><div id="main"></div></div>
<div id="print"></div>
<script src="https://cdn.jsdelivr.net/npm/lucide@0.263.1/dist/umd/lucide.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
<script>
const W=420,H=594,$=s=>document.querySelector(s);
let uid=1;const nid=()=>'i'+uid++;
const lorem="Every page in this book inherits its header, footer, logo and guides from a master. Change the master once and every page that uses it updates, while individual pages stay free to override what they need. ";
const st={
 masters:{A:{name:'A-Master',m:36,cols:2,items:[
  {id:'h',t:'text',x:36,y:16,w:240,h:24,text:'Adore Press · Quarterly',size:11,b:1},
  {id:'lg',t:'rect',x:W-36-26,y:14,w:26,h:26,fill:'#0f766e'},
  {id:'f',t:'text',x:36,y:H-34,w:W-72,h:22,text:'Page {#}',size:10,align:'center',fw:1}]}},
 stories:{s1:(lorem.repeat(4)+'\n\n').repeat(3).trim()},
 imgs:{},auto:true,stat:'',pages:[],view:'page',cur:null,mk:'A',sel:null,ps:new Set(),focus:false};
const frame=(p)=>({id:nid(),t:'story',story:'s1',x:36,y:60,w:W-72,h:H-120,size:11});
function newPage(master,withFrame){const p={id:nid(),master,items:[],ov:{},land:false};if(withFrame)p.items.push(frame());return p}
st.pages=[newPage('A',1),newPage('A',1),newPage('A',0)];st.cur=st.pages[0].id;st.ps=new Set([st.cur]);

const dims=p=>p.land?[H,W]:[W,H];
const mast=(k)=>st.masters[k||st.mk];
const curPage=()=>st.pages.find(p=>p.id===st.cur)||st.pages[0];
function adj(it,p){const[pw,ph]=dims(p),dw=pw-W,dh=ph-H,c={...it};
 if(it.x+it.w/2>W/2+1)c.x+=dw;if(it.y+it.h/2>H/2)c.y+=dh;if(it.fw)c.w+=dw;return c}
function tgt(){const s=st.sel;if(!s)return null;
 if(s.src==='M')return mast().items.find(x=>x.id===s.id);
 const p=st.pages.find(x=>x.id===s.pid);if(!p)return null;
 if(s.src==='p')return p.items.find(x=>x.id===s.id);
 if(s.src==='o')return p.ov[s.id];
 return mast(p.master).items.find(x=>x.id===s.id)}
const div=(c,t)=>{const d=document.createElement('div');if(c)d.className=c;if(t!=null)d.textContent=t;return d};

/* Text threading: fill each linked frame in page order, remainder flows on */
function parseMd(s){const T=[];s.split(/\n\s*\n/).forEach(blk=>{blk=blk.trim();if(!blk)return;
 const im=blk.match(/^!\[(\w+)\]$/);if(im){T.push({k:'img',id:im[1],nb:true});return}
 const ls=blk.split('\n');if(ls.every(l=>l.trim().startsWith('|'))){ls.forEach(l=>T.push({k:'tr',cells:l.trim().replace(/^\||\|$/g,'').split('|').map(c=>c.trim()),nb:true}));return}
 let k='p';const m=blk.match(/^(#{1,3})\s+/);if(m){k='h'+m[1].length;blk=blk.slice(m[0].length)}
 let b=0,i=0,first=true;const re=/(\*\*)|(\*)|([^\s*]+)/g;let x;
 while((x=re.exec(blk))){if(x[1])b=!b;else if(x[2])i=!i;else{let j=re.lastIndex;while(blk[j]==='*')j++;
  T.push({w:x[3]+(j>=blk.length||/\s/.test(blk[j])?' ':''),b,i,k,nb:first});first=false}}});return T}
function fill(el,T,fw,fh){el.textContent='';let cur=null,span=null,tbl=null;
 T.forEach(t=>{if(t.k==='tr'){if(!tbl){tbl=document.createElement('table');tbl.style.cssText='border-collapse:collapse;width:100%;margin:0 0 6px;font-size:.9em';el.append(tbl)}
   const tr=tbl.insertRow();t.cells.forEach(c=>{const td=tr.insertCell();td.textContent=c;td.style.cssText='border:1px solid #8a948f;padding:2px 4px;vertical-align:top'});cur=null;span=null;return}
  tbl=null;
  if(t.k==='img'){const im=st.imgs[t.id]||{src:'',w:100,h:60};let w=Math.min(im.w||100,(fw||300)-8),h=w*(im.h||60)/(im.w||100);if(fh&&h>fh-14){h=fh-14;w=h*(im.w||100)/(im.h||60)}
   const e=document.createElement('img');e.src=im.src;e.style.cssText=`display:block;margin:0 0 6px;width:${w}px;height:${h}px`;el.append(e);cur=null;span=null;return}
  if(!cur||t.nb){cur=document.createElement(t.k==='p'?'p':t.k);el.append(cur);span=null}
  const key=(t.b?1:0)+''+(t.i?1:0);
  if(!span||span.dataset.k!==key){span=document.createElement('span');span.dataset.k=key;if(t.b)span.style.fontWeight=700;if(t.i)span.style.fontStyle='italic';cur.append(span)}
  span.textContent+=t.w})}
let FL=new Map();
function flow(){FL=new Map();const m=document.createElement('div');
 m.className='tx st';m.style.cssText='position:absolute;visibility:hidden;left:-9999px;height:auto;overflow:visible';
 document.body.appendChild(m);
 for(const k in st.stories){const fr=[];st.pages.forEach(p=>p.items.forEach(it=>{if(it.t==='story'&&it.story===k)fr.push(it)}));
  const tk=parseMd(st.stories[k]);let pos=0;
  fr.forEach((it,n)=>{m.style.width=it.w+'px';m.style.fontSize=(it.size||11)+'px';let lo=0,hi=tk.length-pos;
   while(lo<hi){const mid=(lo+hi+1)>>1;fill(m,tk.slice(pos,pos+mid),it.w,it.h);if(m.scrollHeight<=it.h)lo=mid;else hi=mid-1}
   if(lo===0&&pos<tk.length)lo=1;const r={toks:tk.slice(pos,pos+lo),over:false,total:tk.length};pos+=lo;r.rest=tk.length-pos;
   if(n===fr.length-1&&pos<tk.length)r.over=true;FL.set(it.id,r)})}
 m.remove()}

function isSel(o,it){const s=st.sel;return !!s&&s.id===it.id&&s.src===o.src&&(o.src==='M'||s.pid===o.p.id)}
function mk(it,o){
 const d=div('it '+it.t+' '+o.src);d.style.cssText=`left:${it.x}px;top:${it.y}px;width:${it.w}px;height:${it.h}px`;
 const sel=!o.print&&isSel(o,it);if(sel)d.classList.add('sel');
 if(it.t==='rect')d.style.background=it.fill;
 else{const tx=div('tx');tx.style.fontSize=(it.size||11)+'px';tx.style.fontWeight=it.b?700:400;tx.style.textAlign=it.align||'left';
  if(it.t==='story'){const f=FL.get(it.id)||{toks:[],over:false};tx.classList.add('st');fill(tx,f.toks,it.w,it.h);if(f.over){d.classList.add('over');if(!o.print)d.append(div('ov','▼ text overflows — add a linked page'))}}
  else{tx.textContent=o.src==='M'?it.text:it.text.replace(/\{#\}/g,o.n);
   if(!o.print&&o.src!=='m'){tx.contentEditable='true';tx.spellcheck=false;
    tx.oninput=()=>{const t=tgt();if(t)t.text=tx.innerText.replace(/\n$/,'');touch()}}}
  d.prepend(tx)}
 if(o.print)return d;
 d.onpointerdown=e=>{e.stopPropagation();if(sel)return;
  st.sel={src:o.src,id:it.id,pid:o.p.id};st.cur=o.p.id;st.focus=true;renderAll()};
 if(sel&&o.src!=='m'){const hm=div('hm','move'),hr=div('hr');
  hm.onpointerdown=e=>drag(e,'m',it,d,hm);hr.onpointerdown=e=>drag(e,'r',it,d,hr);d.append(hm,hr)}
 return d}
function drag(e,mode,it,d,h){e.preventDefault();e.stopPropagation();const x0=e.clientX,y0=e.clientY,o={...it};h.setPointerCapture(e.pointerId);
 const mv=ev=>{const dx=ev.clientX-x0,dy=ev.clientY-y0;
  if(mode==='m'){it.x=Math.round(o.x+dx);it.y=Math.round(o.y+dy)}else{it.w=Math.max(16,Math.round(o.w+dx));it.h=Math.max(12,Math.round(o.h+dy))}
  d.style.left=it.x+'px';d.style.top=it.y+'px';d.style.width=it.w+'px';d.style.height=it.h+'px'};
 const up=()=>{h.removeEventListener('pointermove',mv);h.removeEventListener('pointerup',up);st.focus=false;renderAll()};
 h.addEventListener('pointermove',mv);h.addEventListener('pointerup',up)}

function guides(el,M,pw,ph){const g=div('gm');g.style.cssText=`left:${M.m}px;top:${M.m}px;width:${pw-2*M.m}px;height:${ph-2*M.m}px`;el.append(g);
 for(let c=1;c<M.cols;c++){const l=div('gc');l.style.left=(M.m+(pw-2*M.m)*c/M.cols)+'px';el.append(l)}}
function pageEl(p,i,print){
 const[pw,ph]=dims(p),M=mast(p.master),n=i+1,el=div('pg');
 el.style.width=pw+'px';el.style.height=ph+'px';
 if(!print)guides(el,M,pw,ph);
 M.items.forEach(mi=>{const ov=p.ov[mi.id];if(ov&&ov.hidden)return;
  el.append(ov?mk(ov,{src:'o',p,n,print}):mk(adj(mi,p),{src:'m',p,n,print}))});
 p.items.forEach(it=>el.append(mk(it,{src:'p',p,n,print})));
 if(!print){el.onpointerdown=()=>{if(st.sel){st.sel=null;renderAll()}};
  el.append(div('badge',M.name))}
 return el}
function masterEl(){const M=mast(),el=div('pg');el.style.width=W+'px';el.style.height=H+'px';
 guides(el,M,W,H);const fake={id:'__m'};M.items.forEach(it=>el.append(mk(it,{src:'M',p:fake,n:'#'})));
 el.onpointerdown=()=>{if(st.sel){st.sel=null;renderAll()}};el.append(div('badge','Editing '+M.name));return el}

/* actions */
const btn=(label,fn,o={})=>{const b=document.createElement('button');b.textContent=label;if(o.pri)b.className='pri';b.disabled=!!o.dis;b.onclick=fn;return b};
function addItem(it){if(st.view==='master')mast().items.push(it);else curPage().items.push(it);st.sel={src:st.view==='master'?'M':'p',id:it.id,pid:curPage().id};st.focus=true;renderAll()}
function insertPage(after,withFrame,master){const i=st.pages.findIndex(p=>p.id===after.id),p=newPage(master||after.master,withFrame);
 st.pages.splice(i+1,0,p);st.cur=p.id;st.ps=new Set([p.id]);st.view='page';st.sel=null;renderAll()}
function exportPdf(){flow();const pr=$('#print');pr.innerHTML='';
 st.pages.forEach((p,i)=>{const s=div('sheet'+(p.land?' land':''));s.append(pageEl(p,i,true));pr.append(s)});window.print()}
window.onafterprint=()=>{$('#print').innerHTML=''};

function addLinkedPage(k){let last=null;st.pages.forEach(x=>x.items.forEach(it=>{if(it.t==='story'&&it.story===k)last=x}));
 if(!last)last=curPage();const M=mast(last.master),[pw,ph]=dims(last);
 const np=newPage(last.master,0);np.items.push({...frame(),x:M.m,y:M.m+24,w:pw-2*M.m,h:ph-2*M.m-48,story:k});
 st.pages.splice(st.pages.indexOf(last)+1,0,np);return np}
function htmlToMd(h){const d=new DOMParser().parseFromString(h,'text/html'),out=[];let nimg=0;
 const inl=n=>{if(n.nodeType===3)return n.textContent.replace(/\*/g,'∗');if(n.nodeType!==1)return'';
  const t=n.tagName.toLowerCase(),s=[...n.childNodes].map(inl).join('');
  if(t==='strong'||t==='b')return s.trim()?'**'+s+'**':s;if(t==='em'||t==='i')return s.trim()?'*'+s+'*':s;if(t==='br')return' ';if(t==='img'){const id='w'+Date.now().toString(36)+(++nimg);st.imgs[id]={src:n.getAttribute('src')||'',w:100,h:60};return'\n\n!['+id+']\n\n'}return s};
 const blk=n=>{const t=n.tagName.toLowerCase();
  if(/^h[1-6]$/.test(t))out.push('#'.repeat(Math.min(3,+t[1]))+' '+inl(n).replace(/\*\*/g,'').trim());
  else if(t==='ul'||t==='ol')[...n.children].forEach((li,j)=>out.push((t==='ul'?'• ':(j+1)+'. ')+inl(li).trim()));
  else if(t==='table')out.push([...n.querySelectorAll('tr')].map(r=>'| '+[...r.children].map(c=>inl(c).replace(/[*|]/g,'').replace(/\s+/g,' ').trim()).join(' | ')+' |').join('\n'));
  else{const s=inl(n).trim();if(s)out.push(s)}};
 [...d.body.children].forEach(blk);return out.filter(x=>x.replace(/[#*\s]/g,'')).join('\n\n').trim()}
async function importDocx(file){
 if(typeof mammoth==='undefined'){alert('The Word reader could not load. Check your connection and try again.');return}
 try{const r=await mammoth.convertToHtml({arrayBuffer:await file.arrayBuffer()});const text=htmlToMd(r.value);
  await Promise.all(Object.values(st.imgs).map(im=>new Promise(res=>{const i=new Image();i.onload=()=>{im.w=i.naturalWidth;im.h=i.naturalHeight;res()};i.onerror=res;i.src=im.src})));
  if(!text){alert('No text was found in that file.');return}
  const k='s1';st.stories[k]=text;
  let has=false;st.pages.forEach(p=>p.items.forEach(it=>{if(it.t==='story')has=true}));
  if(!has)curPage().items.push(frame());
  for(let g=0;g<20;g++){flow();const fs=[];st.pages.forEach(p=>p.items.forEach(it=>{if(it.t==='story')fs.push(it)}));
   const r=FL.get(fs[fs.length-1].id);if(!r||!r.over)break;
   const per=Math.max(1,(r.total-r.rest)/fs.length);for(let j=Math.max(1,Math.ceil(r.rest/per));j>0;j--)addLinkedPage(k)}
  flow();for(let i=st.pages.length-1;i>0;i--){const p=st.pages[i],sf=p.items.find(x=>x.t==='story');if(!sf)continue;
   if(p.items.length===1&&FL.get(sf.id)&&!FL.get(sf.id).toks.length)st.pages.splice(i,1);else break}
  st.view='page';st.cur=st.pages[0].id;st.ps=new Set([st.cur]);st.sel=null;renderAll();
 }catch(e){alert('Could not read that file. Please use a .docx Word file.')}}
function renderBar(){const b=$('#bar');b.innerHTML='';const h=document.createElement('h1');h.textContent='Adore Page';b.append(h);
 const s=st.sel,master=st.view==='master',p=curPage();
 b.append(btn('Text',()=>addItem({id:nid(),t:'text',x:60,y:120,w:200,h:40,text:'New text',size:12})),
  btn('Rectangle',()=>addItem({id:nid(),t:'rect',x:60,y:120,w:80,h:50,fill:'#94a3b8'})),
  btn('Linked frame',()=>addItem({...frame(),y:80,h:200}),{dis:master}));
 const sep=()=>b.append(Object.assign(div('sep')));sep();
 if(s&&s.src==='m'){b.append(btn('Override on this page',()=>{const mi=mast(p.master).items.find(x=>x.id===s.id);p.ov[s.id]=adj(mi,p);st.sel={...s,src:'o'};renderAll()},{pri:1}),
   btn('Remove from this page',()=>{p.ov[s.id]={hidden:true};st.sel=null;renderAll()}))}
 else if(s&&s.src==='o'){b.append(btn('Restore master link',()=>{delete p.ov[s.id];st.sel={...s,src:'m'};renderAll()},{pri:1}),
   btn('Remove from this page',()=>{p.ov[s.id]={hidden:true};st.sel=null;renderAll()}))}
 else if(s)b.append(btn('Delete item',()=>{const L=s.src==='M'?mast().items:p.items,i=L.findIndex(x=>x.id===s.id);if(i>=0)L.splice(i,1);st.sel=null;renderAll()}));
 if(!master&&Object.keys(p.ov).length)b.append(btn('Restore all master items',()=>{p.ov={};st.sel=null;renderAll()}));
 sep();
